[package]
name = "bid-tools"
version.workspace = true
edition.workspace = true

[dependencies]
bid-domain = { path = "../bid-domain" }
bid-parse = { path = "../bid-parse" }
bid-engine = { path = "../bid-engine" }
bid-kb = { path = "../bid-kb" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
# docx 写入（S-6 组装导出）：版本已在依赖图中（bid-engine → mdc-office-io →
# docx-rs 0.4.22，Cargo.lock 既有条目）——本声明不新增三方面，只把既有
# 传递依赖提为直接依赖。0.4.22 的 Docx::pack 直接把 XML 部件流式写进 zip
# writer（不物化整包 Vec<u8>），TableOfContents 原生支持 TOC \o 域指令。
docx-rs = "0.4"
# #68 阶段 1：RealGenerator 的 HTTP 传输面（阻塞 + rustls，无 tokio）。
ureq = { workspace = true }
# #68 阶段 3：导出图片嵌入（格式验证/转 PNG/版面缩放——Pic 构建面）。
image = { workspace = true }
# #182：审批密钥的 OS 熵源（getrandom 0.2 已在 workspace 锁内——Cargo.lock
# 既有条目，零新增网络取数；直连声明同 sha2 先例）。
getrandom = "0.2"
# #317：暗标泄露扫描面——解包导出产物读 XML 部件（生产依赖：dark_bid.rs
# 的扫描器在 lib 面，非测试专属）。版本同 dev-dependencies 钉 4（锁内既有）。
zip = "4"

[dev-dependencies]
# 测试面（S-6 验收）：解包导出产物校验 zip 完整性 + XML 良构（「Word 打开
# B4 后 workspace 已删 zip/quick-xml 条目——测试面独立钉版本，仅 dev-dependency。
quick-xml = "0.36"
