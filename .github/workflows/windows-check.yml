name: windows-check

# 目标：把 Windows 编译面纳入 CI。
# 由来：
#   1. bid-parse/src/guard.rs 的 E0596 在 #[cfg(not(unix))] 分支里，
#      因为 CI 只跑 Linux，该分支从未被编译，bug 潜伏后被合并冲掉。
#   2. 本机复检时发现 Windows 直接 cargo check 失败。
#
# B3-1 增补（issue #2 §B3/§3.1）：
#   - 条件执行（PR #15 Lead review 指定模式）：secret 未配置时步骤跳过而非失败；
#   - bid-engine 引入 mdc-office-io git 依赖（mdcore 为私有仓）——
#     CI 用**只读 deploy key** 拉取（issue #2 §3.1 纪律：不得把 PAT 写进仓库或 CI 日志）；
#   - CARGO_NET_GIT_FETCH_WITH_CLI=true 让 cargo 走 git CLI（尊重 SSH 配置）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  # cargo git 依赖走 git CLI（尊重 ~/.ssh 与 insteadOf——deploy key 通道）
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: windows / cargo check
    runs-on: windows-latest
    env:
      # job 级 env 才能被 step 的 if 读到（GitHub 不允许 if 直接用 secrets）
      # ——PR #15 Lead review 指定的条件执行模式：无 secret 时跳过凭据布置。
      MD_CORE_DEPLOY_KEY: ${{ secrets.MD_CORE_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure mdcore read access (deploy key)
        # issue #2 §3.1：mdcore 私有仓凭据 = 只读 deploy key（secret MD_CORE_DEPLOY_KEY）。
        # PAT 不入库、不入日志——key 只写 runner 的 ~/.ssh/id_ed25519。
        # **条件执行**：无 secret 时跳过（mdcore public 窗口匿名 clone 即可）；
        # 真门禁 = cargo check 的 fetch（fetch 失败即红），本步骤只布置凭据。
        if: env.MD_CORE_DEPLOY_KEY != ''
        shell: pwsh
        run: |
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          # 行尾归一（secret 传输面可能引入 CRLF）+ 精确字节写入（绕开 Out-File 编码面）
          $key = $env:MD_CORE_DEPLOY_KEY -replace "`r`n", "`n"
          [IO.File]::WriteAllText("$sshDir\id_ed25519", $key + "`n")
          echo "key bytes: $((Get-Item "$sshDir\id_ed25519").Length)"
          # Windows OpenSSH 权限收紧（防 "bad permissions" 拒载）
          icacls "$sshDir\id_ed25519" /inheritance:r /grant:r "$($env:USERNAME):R" | Out-Null
          ssh-keyscan -t ed25519 github.com 2>$null | Out-File -FilePath "$sshDir\known_hosts" -Encoding ascii
          # https → ssh 改道（仅 mdcore 仓——其他 git 依赖不受影响）
          git config --global url."git@github.com:mmqz/mdcore.git".insteadOf "https://github.com/mmqz/mdcore"
          # 凭据连通性探测（诊断面：打印退出码不判死——真门禁是 cargo check 的 fetch）
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -T git@github.com 2>$null | Out-Null
          $sshCode = $LASTEXITCODE
          echo "ssh -T exit code: $sshCode (0/1=认证面 OK，255=见 cargo check 结果)"
          # 退出码归一（PR #15 CI 红根因修复）：
          # GitHub 对 `ssh -T` 不提供 shell——认证成功也返回 1。若不归一，
          # 该 1 会成为 pwsh 步骤的最终退出码 → 步骤误判失败 → cargo check 全被跳过。
          # 本步骤只做凭据布置 + 诊断（commit c57ce99 的设计意图即「不判死」），
          # 真正的门禁是后续 cargo check 的 git fetch。故恒 exit 0。
          exit 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # #295（方案 A）：CI 装 poppler——9 条 songling L1 验收门
      # （songling_baseline.rs ×4 + songling_scoring_outline.rs ×5，含
      # #253 配额分布核心门）此前因 Windows 无 poppler 全程 SKIP、CI 零覆盖；
      # #266 的 quota 0.824→0.820 回归因此在 main 静默存活到 C 本机才暴露。
      # choco 的 poppler 包封装 oschwartz10612 社区构建（pdftotext/pdfinfo/
      # pdftoppm 全在 PATH）——与本地 Linux 同源同工具族。装完自检三工具
      # 版本，版本号进日志（基线跨平台核对的证据面）。
      - name: Install poppler (#295 - L1 验收门 CI 覆盖)
        shell: pwsh
        run: |
          choco install poppler -y --no-progress
          # 不赌 choco shim 布局：递归定位 pdftotext.exe 的真实目录，
          # 写进 GITHUB_PATH（后续所有 step 生效）——shim 在与不在都对。
          $pdftotext = (Get-ChildItem -Path 'C:\ProgramData\chocolatey' -Recurse -Filter 'pdftotext.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $pdftotext) { throw 'pdftotext.exe not found after choco install poppler' }
          $binDir = Split-Path $pdftotext
          echo $binDir >> $env:GITHUB_PATH
          echo "poppler bin: $binDir"
          # 本 step 内自检（GITHUB_PATH 对当前 step 不回灌——手动前置）
          $env:Path = "$binDir;$env:Path"
          pdftotext -v
          pdfinfo -v
          pdftoppm -v

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bidcore/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('bidcore/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        working-directory: bidcore
        run: cargo check --workspace --all-targets

      # #76：mang-app 是独立 workspace（自己的 [workspace] 段，bidcore 的
      # --workspace 不含它）——此前零 CI 覆盖，桌面壳改动只靠 Lead 手验。
      # 桌面壳是 Windows 交付面，在这里补一道编译门禁（tao/wry 在
      # windows-latest 编译无需 WebView2 运行时，仅链接时需要，runner 自带）。
      - name: cargo check (mang-app 独立 workspace)
        working-directory: bidcore/crates/mang-app
        run: cargo check --all-targets

      - name: cargo test (SKIP 机制护航，全量 workspace)
        working-directory: bidcore
        # issue #9 SKIP 机制已落地：外部工具缺件时，PDF 全链测试
        # （corpus_probe / kb_probe / e2e_m1）打 SKIP 横幅并提前 return，
        # 计数 passed 而非 failed。#295 起 poppler 在位（songling 9 门真跑），
        # 但 tesseract 仍缺件（OCR 面测试继续 SKIP——见下方 SKIP 汇总步骤）。
        # --no-fail-fast：**不要**在第一个失败目标后停跑。
        # 教训（2026-11-02）：默认行为是「遇第一个失败目标就停」，
        # 于是 bid-mcp 的 score_tools 红了很久，bid-parse 的 9 个测试
        # 二进制**从来没在 CI 里跑过**——#168 修好一个红灯后，
        # 下一个红灯（addendum_recovery 的 CJK 乱码，见 #169）才浮现。
        # 全量报错能一次看全，而不是每次只揭露一个（20 分钟/轮）。
        # #295：输出 tee 到文件——后述 SKIP 汇总/横幅核验步骤读日志回放，
        # 不再为了看横幅重跑一遍全量（旧 Verify 步骤的重跑每次白烧 ~15 分钟）。
        # pwsh 管道下 $LASTEXITCODE 仍取 cargo 的退出码（Tee-Object 是 cmdlet
        # 不碰它）——测试失败照样红，语义不变。
        shell: pwsh
        run: cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\test-output.log"

      # #295（横幅核验改为日志回放）：旧步骤为了看一条 SKIP 横幅把
      # `cargo test --workspace` **整个重跑一遍**（每轮白烧 ~15 分钟）——
      # 现在读上一步 tee 的日志，语义不变（两种环境都容忍）。
      - name: Verify SKIP banner emitted (#295 起读日志回放，不重跑)
        working-directory: bidcore
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\test-output.log"
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'SKIP: probe_corpus_a_full_chain' -Quiet)) {
            echo 'SKIP banner verified: probe_corpus_a_full_chain correctly skipped (ENV_MISSING)'
          } else {
            echo 'No SKIP banner (tools present on runner) - full chain executed'
          }

      # #295（方案 C）：SKIP 可见性——「CI 全绿 ≠ 稳定」的止血面。
      # 汇总全量测试输出里的 SKIP 横幅到 job summary + workflow warning
      # 注解：一眼看清本轮 CI 有多少门「绿着但没跑」（缺件跳过）。
      # 本步骤不判红（缺件跳过是 #9 机制的设计行为）——但 SKIP 数 > 0 时
      # 用 ::warning 注解把它顶到 PR 页面，不再淹没在日志中部。
      - name: SKIP 汇总（#295 方案 C——CI 覆盖缺口可见性）
        if: always()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\test-output.log"
          echo '### SKIP 汇总（#295）' >> $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path $log)) {
            echo '（测试日志缺失——本步骤晚于测试步骤或测试未跑）' >> $env:GITHUB_STEP_SUMMARY
            return
          }
          $skips = @(Select-String -Path $log -Pattern '^SKIP: (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique)
          if ($skips.Count -eq 0) {
            echo '零 SKIP——全部测试真实运行 ✅（#295 起 poppler 在位，songling 9 门已转真跑）' >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo "**$($skips.Count) 个测试被 SKIP（ENV_MISSING——CI 覆盖缺口，见下）**：" >> $env:GITHUB_STEP_SUMMARY
            $skips | ForEach-Object { echo "- $_" >> $env:GITHUB_STEP_SUMMARY }
            echo '' >> $env:GITHUB_STEP_SUMMARY
            echo '缺口清单与补装指引见 issue #9 SKIP 机制（横幅即指引）；OCR 面（tesseract）缺件是当前已知缺口。' >> $env:GITHUB_STEP_SUMMARY
            echo "::warning::CI 覆盖缺口：$($skips.Count) 个测试 SKIP（$($skips -join '、')）——CI 全绿不覆盖这些门"
          }

      - name: Detect external toolchain
        if: always()
        run: |
          $tools = @('tesseract','pdftoppm','pdftotext','pdfinfo')
          $missing = @()
          foreach ($t in $tools) {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { $missing += $t }
          }
          echo '### 外部工具链探测' >> $env:GITHUB_STEP_SUMMARY
          if ($missing.Count -eq 0) {
            echo 'All external tools present.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo '**ENV_MISSING**: ' + ($missing -join ', ') >> $env:GITHUB_STEP_SUMMARY
            echo '' >> $env:GITHUB_STEP_SUMMARY
            echo '#295 起 poppler 已在 CI 安装（pdftotext/pdfinfo/pdftoppm）；仍缺件的工具见上——其门禁测试按 issue #9 SKIP 机制跳过（横幅 + 提前 return，非 FAIL），明细见 SKIP 汇总。' >> $env:GITHUB_STEP_SUMMARY
          }
