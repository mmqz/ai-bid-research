<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>mang — 标书工作台</title>
<style>
  /* ================= mang shell 主题（Stage 1）=================
     #42 硬性要求：
     1. 整页面 100vh，编辑区 flex_1 + min_h_0
     2. 绝对不出现整页滚动条（html/body overflow hidden——铁律）
     3. 只有编辑区内可以有滚动
     4. 窗口最小 1024×640（宿主 tao 侧钉定；web 面配合最小宽布局）
  ================================================================ */
  :root {
    /* VSCode 桌面观感变量（light） */
    --bg: #ffffff;
    --fg: #3b3f45;
    --fg-muted: #6a707a;
    --chrome-bg: #f3f4f6;          /* 菜单栏/Tab 栏/侧栏底 */
    --chrome-bg-2: #e9ebef;        /* activity 条 */
    --border: #d4d7dd;
    --border-soft: #e6e8ec;
    --accent: #2f6fed;
    --accent-soft: #e8f0fe;
    --tab-active-bg: #ffffff;
    --tab-hover-bg: #eceef2;
    --statusbar-bg: #2f6fed;       /* VSCode 蓝 statusbar */
    --statusbar-fg: #ffffff;
    --sidebar-width: 260px;
    --activitybar-width: 48px;
    --menubar-h: 32px;
    --tabbar-h: 34px;
    --statusbar-h: 26px;
    --danger: #c0392b;
  }
  [data-theme="dark"] {
    --bg: #1e2025;
    --fg: #d7dade;
    --fg-muted: #9aa1ab;
    --chrome-bg: #25282e;
    --chrome-bg-2: #2b2f36;
    --border: #3a3f47;
    --border-soft: #33373e;
    --accent: #4c8dff;
    --accent-soft: #22304a;
    --tab-active-bg: #1e2025;
    --tab-hover-bg: #2c3037;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;              /* 铁律 2：整页滚动绝不出现 */
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 13px;
    background: var(--chrome-bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ================= 布局骨架（五区 grid）================= */
  .mang-shell {
    display: grid;
    height: 100vh;                 /* 铁律 1 */
    grid-template-columns: var(--activitybar-width) var(--sidebar-width) 1fr;
    grid-template-rows: var(--menubar-h) var(--tabbar-h) 1fr var(--statusbar-h);
    grid-template-areas:
      "menubar  menubar  menubar"
      "activity tabs     tabs"
      "activity sidebar  editor"
      "status   status   status";
    overflow: hidden;
  }
  /* 无侧栏态（Ctrl+B 切换）：activity 条收窄为图标条本身 */
  .mang-shell.no-sidebar {
    grid-template-columns: var(--activitybar-width) 0 1fr;
  }

  /* ================= 菜单栏（32px）================= */
  .menubar {
    grid-area: menubar;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
  }
  .menubar-item {
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--fg);
  }
  .menubar-item:hover { background: var(--tab-hover-bg); }
  .menubar-item.open { background: var(--accent-soft); }
  .menubar-brand {
    font-weight: 600;
    padding: 0 10px 0 2px;
    color: var(--fg);
    letter-spacing: 0.5px;
  }

  /* ================= Activity 条（48px 图标条）================= */
  .activity {
    grid-area: activity;
    background: var(--chrome-bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 0;
    gap: 2px;
  }
  .activity-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: var(--fg-muted);
    font-size: 17px;
    position: relative;
    border: none;
    background: transparent;
  }
  .activity-btn:hover { color: var(--fg); background: var(--tab-hover-bg); }
  .activity-btn.active {
    color: var(--fg);
  }
  .activity-btn.active::before {
    content: "";
    position: absolute;
    left: -8px; top: 8px; bottom: 8px;
    width: 2.5px;
    background: var(--accent);
    border-radius: 2px;
  }
  .activity-spacer { flex: 1; }

  /* ================= 侧栏（文件树/历史/改动/收藏/设置）================= */
  .sidebar {
    grid-area: sidebar;
    background: var(--chrome-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;              /* 侧栏内部滚动，条不出现在页面级 */
    min-height: 0;
  }
  .sidebar-title {
    padding: 10px 14px 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--fg-muted);
    flex: none;
  }
  .sidebar-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 6px 12px;
  }

  /* 文件树 */
  .tree-item {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 24px;
    padding: 0 8px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-item:hover { background: var(--tab-hover-bg); }
  .tree-item.selected { background: var(--accent-soft); }
  .tree-item .caret {
    width: 12px; flex: none;
    color: var(--fg-muted);
    font-size: 10px;
    text-align: center;
    transition: transform 0.12s ease;
  }
  .tree-item .caret.expanded { transform: rotate(90deg); }
  .tree-children { margin-left: 14px; }
  .tree-empty {
    padding: 12px 10px;
    color: var(--fg-muted);
    font-size: 12px;
    line-height: 1.7;
  }

  /* 空状态欢迎页（#42 §五）——渲染在编辑区 */
  .welcome {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--fg-muted);
    background: var(--bg);
  }
  .welcome h1 { color: var(--fg); font-size: 22px; font-weight: 600; margin-bottom: 14px; }
  .welcome h2 {
    align-self: flex-start;
    font-size: 12px; font-weight: 600; color: var(--fg);
    margin: 18px 0 6px;
  }
  .welcome-recent {
    width: 420px;
    max-width: 80%;
  }
  .welcome-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--fg);
  }
  .welcome-item:hover { background: var(--accent-soft); }
  .welcome-item .when { color: var(--fg-muted); font-size: 12px; }
  .welcome-actions { display: flex; gap: 10px; margin-top: 22px; }
  .welcome-btn {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 13px;
  }
  .welcome-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .welcome-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ================= Tab 栏（34px）================= */
  .tabbar {
    grid-area: tabs;
    display: flex;
    align-items: stretch;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    overflow: hidden;              /* 多 Tab 横向滚动——后续阶段 */
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 10px 0 14px;
    min-width: 120px;
    max-width: 220px;
    border-right: 1px solid var(--border);
    color: var(--fg-muted);
    cursor: pointer;
    position: relative;
    white-space: nowrap;
  }
  .tab:hover { background: var(--tab-hover-bg); }
  .tab.active {
    background: var(--tab-active-bg);
    color: var(--fg);
    border-top: 2px solid var(--accent);
    padding-top: 0;
  }
  .tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .tab-dirty {                     /* ● AI 刚更新/未保存 */
    color: var(--accent);
    font-size: 9px;
  }
  .tab-close {
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    color: var(--fg-muted);
    font-size: 13px;
    opacity: 0;                    /* VSCode：悬停才明显 */
  }
  .tab:hover .tab-close { opacity: 1; }
  .tab-close:hover { background: var(--tab-hover-bg); color: var(--danger); }

  /* ================= 编辑区（唯一可滚区）================= */
  .editor-area {
    grid-area: editor;
    background: var(--bg);
    overflow: hidden;              /* 滚动条只出现在 .editor-scroll */
    display: flex;
    flex-direction: column;
    min-height: 0;                 /* 铁律 1：flex_1 + min_h_0 */
    min-width: 0;
  }
  .editor-scroll {
    flex: 1;
    min-height: 0;
    overflow: auto;                /* 铁律 3：整页唯一滚动容器 */
    padding: 16px 22px;
    user-select: text;
  }
  .editor-placeholder {
    color: var(--fg-muted);
    line-height: 1.8;
    max-width: 640px;
  }

  /* ================= 状态栏（26px）================= */
  .statusbar {
    grid-area: status;
    grid-column: 1 / -1;
    background: var(--statusbar-bg);
    color: var(--statusbar-fg);
    display: flex;
    align-items: center;
    gap: 0;
    font-size: 12px;
    padding: 0 10px;
    overflow: hidden;
  }
  .status-item {
    padding: 0 9px;
    height: 100%;
    display: flex; align-items: center;
    white-space: nowrap;
    cursor: default;
  }
  .status-item.clickable:hover { background: rgba(255,255,255,0.14); }
  .status-spacer { flex: 1; }

  /* 截断徽标（工作区扫描越限——显式不静默） */
  .truncated-badge {
    color: var(--danger);
    font-size: 11px;
    padding: 2px 8px;
  }
</style>
</head>
<body>
  <div class="mang-shell" id="shell">
    <!-- 32px 菜单栏（-□× 由宿主原生窗口提供——web 面不画） -->
    <div class="menubar" id="menubar">
      <span class="menubar-brand">mang</span>
      <!-- 菜单项由 app.ts 注入（文件/编辑/查看/帮助） -->
    </div>

    <!-- 48px activity 条（侧栏切换，不切主视图） -->
    <div class="activity" id="activity"><!-- 图标由 app.ts 注入 --></div>

    <!-- 侧栏（内容随 activity 图标切换） -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title" id="sidebar-title">打开的编辑器</div>
      <div class="sidebar-body" id="sidebar-body"></div>
    </div>

    <!-- 34px Tab 栏 -->
    <div class="tabbar" id="tabbar"></div>

    <!-- 编辑区（唯一可滚） -->
    <div class="editor-area">
      <div class="editor-scroll" id="editor-scroll">
        <div class="editor-placeholder">
          <p>Stage 1 布局骨架——编辑器核将在 Stage 3（Tab 管理）接入。</p>
        </div>
      </div>
    </div>

    <!-- 26px 状态栏 -->
    <div class="statusbar" id="statusbar"></div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
