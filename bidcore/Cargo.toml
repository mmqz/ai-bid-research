[workspace]
resolver = "2"
members = [
    "crates/bid-domain",
    "crates/bid-parse",
    "crates/bid-kb",
    "crates/bid-tools",
    "crates/bid-grade",
    "crates/bid-mcp",
    "crates/bid-engine",
    "crates/mang-snap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
unicode-normalization = "0.1"
libc = "0.2"
# B4（issue #11 任务 3）：zip / quick-xml / calamine / memchr 工作区条目已删——
# docx/xlsx 解析收敛引擎（bid-engine → mdc-office-io），workspace 成员不再
# 直接依赖 OOXML 解析栈（引擎侧依赖不入本清单）。

[profile.release]
debug = false
