[package]
name = "bid-engine"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "issue #2 · B3：引擎适配层唯一接触面——mdc-office-io 固定 rev 接入 + EngineReader 实装 + 字段级映射"

# B3 边界（issue #2 §B3 + issue #11 主线）：
# - 本 crate 是标书仓**唯一**引擎接触面（issue #2 §1 约束 1）；
# - 只做「调用与字段搬运」——解析/安全门/指纹语义一律引擎侧（约束 2），
#   引擎缺口走账本登记，禁止映射层自研补齐（约束 3）；
# - mdcore 以**完整 40 位 rev** 钉住（issue #2 §3.1——禁止 branch/tag 浮动）；
#   升级 rev 走独立 PR（chore(dep): bump mdcore to <hash>）并重跑基线差分。

[dependencies]
bid-parse = { path = "../bid-parse" }

# ── mdcore 引擎接入（B3 主线 · issue #11 验收：cargo tree -p bid-engine 必须见 mdc-office-io）──
# rev = mdcore main @ 2d0144456162389cccdfadfbed22b9e7c30d697d（含全部 B3 前置修复：
#   #17 修订 ins/delText（f7ddd39）/ #18 文本框（f7ddd39）/ #19 批注脚注尾注（f7ddd39）/
#   A1 标题层级四链解析（a85decd）/ A2 表现型域剥离（338acdc）/ P2-1 BlockSource 加性扩面（f19cd6a））
# 私有仓凭据：本机 ~/.gitconfig insteadOf 注入（PAT 不入仓、不入 CI 日志——issue #2 §3.1）。
mdc-office-io = { git = "https://github.com/mmqz/mdcore", rev = "2d0144456162389cccdfadfbed22b9e7c30d697d", package = "mdc-office-io" }
sha2 = "0.10"
hex = "0.4"
# calamine 0.36 与引擎 mdc-office-io 同版（Data/Range/Dimensions 类型面——读侧零语义，仅字段搬运）
calamine = "0.36"

[dev-dependencies]
serde_json = "1"
