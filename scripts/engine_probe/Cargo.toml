[package]
name = "engine-probe"
version = "0.1.0"
edition = "2021"

# B2 引擎侧探针（issue #2 §B2 重点核实 7 条「待验证」）：
# 只读审计 harness——scripts/ 下独立验证工具，非产品代码（与 baseline_harness 同纪律）。
#
# PR #15：本地路径依赖改为 git 固定 rev（与 bid-engine 同 rev——双跑差分两侧
# 必须同引擎版本；path 依赖绑死原审计机路径，换环境即断）。
# mdcore 私仓凭据走本机 ~/.gitconfig insteadOf（PAT 不入仓）。

[dependencies.mdc-office-io]
package = "mdc-office-io"
git = "https://github.com/mmqz/mdcore"
rev = "3204342d9a5ee33400aba2b17dad29696e2f0bb8"

[dependencies.mdc-pdf]
package = "mdc-pdf"
git = "https://github.com/mmqz/mdcore"
rev = "3204342d9a5ee33400aba2b17dad29696e2f0bb8"
features = ["engine-pdfium"]

[dependencies.zip]
package = "zip"
version = "2"
default-features = false
features = ["deflate"]

[dependencies.serde_json]
version = "1"

[workspace]

[[bin]]
name = "engine-probe-p1"
path = "src/bin/p1.rs"

[[bin]]
name = "engine-probe-dump"
path = "src/bin/dump.rs"
