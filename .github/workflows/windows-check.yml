name: windows-check

# 目标：把 Windows 编译面纳入 CI。
# 由来：
#   1. bid-parse/src/guard.rs 的 E0596 在 #[cfg(not(unix))] 分支里，
#      因为 CI 只跑 Linux，该分支从未被编译，bug 潜伏后被合并冲掉。
#   2. 本机复检时发现 Windows 直接 cargo check 失败。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3

jobs:
  check:
    name: windows / cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bidcore/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('bidcore/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo check
        working-directory: bidcore
        run: cargo check --workspace --all-targets

      - name: cargo test (no external deps required)
        working-directory: bidcore
        # 只跑不依赖 tesseract/pdftoppm/pdftotext 的 crate。
        # e2e_m1 依赖 OCR 工具链，在无 OCR 环境下按 SKIP 处理（见 issue #9）。
        run: cargo test --workspace --exclude bid-grade

      - name: Detect external toolchain
        if: always()
        run: |
          $tools = @('tesseract','pdftoppm','pdftotext','pdfinfo')
          $missing = @()
          foreach ($t in $tools) {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { $missing += $t }
          }
          echo '### 外部工具链探测' >> $env:GITHUB_STEP_SUMMARY
          if ($missing.Count -eq 0) {
            echo 'All external tools present.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            echo '**ENV_MISSING**: ' + ($missing -join ', ') >> $env:GITHUB_STEP_SUMMARY
            echo '' >> $env:GITHUB_STEP_SUMMARY
            echo '`bid-grade` 的 e2e_m1 场景依赖 OCR 工具链，本 job 已排除该 crate。' >> $env:GITHUB_STEP_SUMMARY
            echo '缺工具时 e2e_m1 应报 SKIP 而非 FAIL（issue #9）。' >> $env:GITHUB_STEP_SUMMARY
          }
